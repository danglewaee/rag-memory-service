services:
  mongo:
    image: mongo:7
    container_name: rag-memory-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  redis:
    image: redis:7
    container_name: rag-memory-redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: rag-memory-backend
    env_file:
      - backend/.env.example
    environment:
      REDIS_URL: redis://redis:6379/0
      MONGODB_URL: mongodb://mongo:27017
    ports:
      - "8000:8000"
    depends_on:
      - mongo
      - redis

volumes:
  mongodata:
